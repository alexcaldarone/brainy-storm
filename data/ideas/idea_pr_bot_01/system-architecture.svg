<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="100%" height="100%" fill="#f8fafc"/>
<style>.title{font:700 22px Arial;fill:#0f172a}.box{fill:#fff;stroke:#6366f1;stroke-width:2}.label{font:600 14px Arial;fill:#0f172a}.small{font:12px Arial;fill:#475569}.edge{stroke:#64748b;stroke-width:2;fill:none}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<text x="32" y="36" class="title">System Architecture</text>
<line x1="350" y1="125" x2="450" y2="125" class="edge" marker-end="url(#arrow)"/>
<text x="400.0" y="113.0" class="small">PR &#x27;Ready for Review&#x27; Webhook</text>
<line x1="730" y1="125" x2="830" y2="125" class="edge" marker-end="url(#arrow)"/>
<text x="780.0" y="113.0" class="small">Enqueue Validated PR Task</text>
<line x1="1110" y1="125" x2="70" y2="305" class="edge" marker-end="url(#arrow)"/>
<text x="590.0" y="203.0" class="small">Pull Job for Diff Analysis</text>
<line x1="350" y1="305" x2="450" y2="305" class="edge" marker-end="url(#arrow)"/>
<text x="400.0" y="293.0" class="small">Pruned AST Chunks</text>
<line x1="730" y1="305" x2="830" y2="305" class="edge" marker-end="url(#arrow)"/>
<text x="780.0" y="293.0" class="small">Prompt with Filtered Code &amp; Vulnerability Context</text>
<line x1="1110" y1="305" x2="450" y2="305" class="edge" marker-end="url(#arrow)"/>
<text x="780.0" y="293.0" class="small">Proposed Code Patch &amp; Explanation</text>
<line x1="730" y1="305" x2="70" y2="485" class="edge" marker-end="url(#arrow)"/>
<text x="400.0" y="383.0" class="small">Apply Patch &amp; Execute Test Suite</text>
<line x1="350" y1="485" x2="450" y2="305" class="edge" marker-end="url(#arrow)"/>
<text x="400.0" y="383.0" class="small">Test Pass/Fail Results &amp; Benchmarks</text>
<line x1="730" y1="305" x2="830" y2="485" class="edge" marker-end="url(#arrow)"/>
<text x="780.0" y="383.0" class="small">Persist Execution &amp; Patch Audit Trail</text>
<line x1="730" y1="305" x2="450" y2="485" class="edge" marker-end="url(#arrow)"/>
<text x="590.0" y="383.0" class="small">Send Verified Patch</text>
<line x1="730" y1="485" x2="70" y2="125" class="edge" marker-end="url(#arrow)"/>
<text x="400.0" y="293.0" class="small">Publish GPG-Signed Suggested Commit &amp; Comment</text>
<line x1="350" y1="125" x2="70" y2="665" class="edge" marker-end="url(#arrow)"/>
<text x="210.0" y="383.0" class="small">Present PR Diff, Safety Score, &amp; Benchmarks</text>
<line x1="350" y1="665" x2="70" y2="125" class="edge" marker-end="url(#arrow)"/>
<text x="210.0" y="383.0" class="small">Human Approval / Merge Sign-Off</text>
<rect x="70" y="75" width="280" height="100" rx="12" class="box"/>
<text x="88" y="105" class="label">GitHub / GitLab VCS</text>
<text x="88" y="130" class="small">Source control management emitting</text>
<text x="88" y="147" class="small">pull request lifecycle events and</text>
<rect x="450" y="75" width="280" height="100" rx="12" class="box"/>
<text x="468" y="105" class="label">Webhook Ingestion Gateway</text>
<text x="468" y="130" class="small">Validates HMAC signatures, enforces</text>
<text x="468" y="147" class="small">&#x27;ready-for-review&#x27; state gating</text>
<rect x="830" y="75" width="280" height="100" rx="12" class="box"/>
<text x="848" y="105" class="label">PR Review Job Queue</text>
<text x="848" y="130" class="small">Durable Redis / SQS message queue</text>
<text x="848" y="147" class="small">holding pending review and remediation</text>
<rect x="70" y="255" width="280" height="100" rx="12" class="box"/>
<text x="88" y="285" class="label">AST Semantic Diff Parser</text>
<text x="88" y="310" class="small">Parses pull request diffs into</text>
<text x="88" y="327" class="small">abstract syntax trees to strip</text>
<rect x="450" y="255" width="280" height="100" rx="12" class="box"/>
<text x="468" y="285" class="label">Review &amp; Remediation Orchestrator</text>
<text x="468" y="310" class="small">Coordinates analysis workflows,</text>
<text x="468" y="327" class="small">manages remediation loop cycles,</text>
<rect x="830" y="255" width="280" height="100" rx="12" class="box"/>
<text x="848" y="285" class="label">LLM Remediation API</text>
<text x="848" y="310" class="small">Enterprise-gated model API used for</text>
<text x="848" y="327" class="small">vulnerability explanation, N+1 query</text>
<rect x="70" y="435" width="280" height="100" rx="12" class="box"/>
<text x="88" y="465" class="label">Ephemeral Sandbox Runner (Docker/gVisor)</text>
<text x="88" y="490" class="small">Spins up cached container snapshots to</text>
<text x="88" y="507" class="small">execute the target repository test</text>
<rect x="450" y="435" width="280" height="100" rx="12" class="box"/>
<text x="468" y="465" class="label">GPG Patch Signer &amp; Commit Formatter</text>
<text x="468" y="490" class="small">Signs validated remediation diffs</text>
<text x="468" y="507" class="small">cryptographically with bot GPG keys</text>
<rect x="830" y="435" width="280" height="100" rx="12" class="box"/>
<text x="848" y="465" class="label">Immutable Audit Vault &amp; Log Store</text>
<text x="848" y="490" class="small">Append-only SOC2-compliant database</text>
<text x="848" y="507" class="small">tracking prompts, generated diffs,</text>
<rect x="70" y="615" width="280" height="100" rx="12" class="box"/>
<text x="88" y="645" class="label">Human Engineer Sign-Off</text>
<text x="88" y="670" class="small">Developer review boundary that</text>
<text x="88" y="687" class="small">inspects interactive diffs, benchmark</text>
</svg>